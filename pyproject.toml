[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tomocube-tools"
dynamic = ["version"]
description = "Tools for working with Tomocube TCF files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "numpy",
    "scipy",
    "matplotlib",
    "tifffile",
    "Pillow",
    "imagecodecs",
]

[project.scripts]
tomocube = "tomocube.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build"]
3d = ["napari[pyqt6]>=0.9.1", "imageio", "imageio-ffmpeg", "pyqtgraph"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tomocube.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false


# h5py Dataset/Group assignment issues - stub limitations
reportAssignmentType = "warning"

# GUI dependencies are optional.
reportMissingImports = "warning"
